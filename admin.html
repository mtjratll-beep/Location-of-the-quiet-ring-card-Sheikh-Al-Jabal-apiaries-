<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d160f"><title>مناحل شيخ الجبل</title><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');:root{--bg:#f5f1e8;--ink:#2b2118;--muted:#776a5c;--gold:#d9a441;--cream:#fffaf0;--dark:#17110c;--line:#eadfca}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eee6d7,#faf8f2 38%,#f1eadf);font-family:Cairo,Arial;color:var(--ink);min-height:100vh}.page{max-width:560px;margin:auto;padding:22px 16px 40px}.brand{text-align:center;margin-bottom:18px}.brand img{width:min(285px,78vw);filter:drop-shadow(0 10px 18px #6b4c241c)}.wallet-head{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 12px}.wallet-head h1{font-size:19px;margin:0}.wallet-card{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(145deg,#1d160f,#3a2615 55%,#6f451c);color:#fff;box-shadow:0 20px 42px #4b321d35;border:1px solid #d5a95855;min-height:310px;padding:20px}.wallet-card:after{content:"";position:absolute;right:-30px;bottom:-50px;width:180px;height:180px;background:radial-gradient(circle,#e0ad4520 2px,transparent 3px);background-size:18px 18px;transform:rotate(18deg)}.card-top,.card-user,.progress-row,.stamps{position:relative;z-index:2}.card-top{display:flex;justify-content:space-between;align-items:flex-start}.mini-brand{display:flex;gap:10px;align-items:center}.mini-brand img{width:58px;height:40px;object-fit:cover;border-radius:10px}.mini-brand strong{display:block;font-size:14px}.mini-brand span{font-size:9px;color:#e8d6ae}.pill{background:#f7d980;color:#3b2916;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}.card-user{margin-top:25px}.hello,.progress-title{font-size:11px;color:#e8d7b2}.customer-name{font-size:21px;font-weight:800}.phone{font-size:11px;color:#d7c6a6}.progress-row{display:flex;justify-content:space-between;align-items:end;margin:18px 0 9px}.progress-num{font-size:25px;font-weight:800;color:#f4d37e}.bar{height:8px;background:#ffffff18;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b7791f,#ffe49a);transition:width .7s}.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:17px}.stamp{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#ffffff0c;border:1px solid #ffffff24;color:#c9bca8;font-size:12px}.stamp.earned{background:radial-gradient(circle at 35% 30%,#ffe6a4,#d49732 58%,#8b551d);color:#2d1b0b;border:2px solid #f7d986;box-shadow:0 0 0 3px #f3cc6820,0 7px 16px #0003;animation:in .6s}.stamp.earned:after{content:'✓';font-weight:900}.stamp.earned span{display:none}@keyframes in{0%{transform:scale(.55);opacity:.1}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}.card-bottom{position:relative;z-index:2;margin-top:15px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#ddcba9}.card-bottom b{color:#ffe39b}.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.btn{border:0;border-radius:15px;padding:13px;font:inherit;font-weight:800;cursor:pointer}.btn-primary{background:linear-gradient(135deg,#e7b64f,#b87520);color:#24170c}.btn-light{background:#fffaf0;color:#4b3621;border:1px solid var(--line)}.login,.info-card{background:#fffaf2;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 12px 30px #5a3e1b0c}.login h2,.info-card h2{margin:0 0 7px}.login p,.info-card p{color:var(--muted);font-size:12px;line-height:1.9}.field{width:100%;border:1px solid #dfd1ba;background:#fff;border-radius:14px;padding:13px;margin:6px 0;font:inherit}.hidden{display:none!important}.gift{text-align:center;margin-top:14px;padding:14px;border-radius:18px;background:linear-gradient(135deg,#fff0bd,#f7cf67);color:#4c2d0d;font-weight:900}.footer{text-align:center;color:#8c7b67;font-size:10px;margin-top:28px;line-height:2}.wa{color:#2d8b54;font-weight:800}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);background:#23170e;color:#fff;padding:12px 16px;border-radius:999px;transition:.35s;z-index:20;font-size:12px}.toast.show{transform:translate(-50%,0)}@media(max-width:390px){.page{padding:16px 11px}.wallet-card{padding:16px}.stamps{gap:6px}}
</style><style id="top-brand-right">.top-brand{display:flex;direction:rtl;align-items:center;justify-content:flex-start;gap:12px;text-align:right;margin:0 0 18px;padding:6px 2px 12px}.top-brand-logo{display:flex;flex-direction:column;align-items:center;order:1;flex:0 0 auto}.top-brand-logo img{width:66px;height:66px;object-fit:contain;background:#fff;border-radius:14px;padding:5px;box-shadow:0 6px 16px #6b4c2420}.top-brand-logo .gold-square{width:66px;height:8px;margin-top:6px;border-radius:4px;background:linear-gradient(90deg,#e7b64f,#b87520);box-shadow:0 2px 6px rgba(184,117,32,.22)}.top-brand-text{order:2;line-height:1.25;min-width:0}.top-brand-text strong{display:block;font-size:21px;font-weight:800;color:#d9a441;white-space:nowrap}.top-brand-text span{display:block;font-size:14px;font-weight:800;color:#d9a441;margin-top:4px}.top-brand-text:after{content:"";display:block;width:100%;max-width:250px;height:5px;margin-top:8px;border-radius:99px;background:linear-gradient(90deg,#e7b64f,#b87520);box-shadow:0 2px 6px rgba(184,117,32,.2)}.google-btn{display:flex;align-items:center;justify-content:center;gap:9px}.google-logo{width:22px;height:22px;display:block;flex:0 0 auto}@media(max-width:390px){.top-brand{gap:9px}.top-brand-text strong{font-size:17px}.top-brand-text span{font-size:12px}.top-brand-logo img,.top-brand-logo .gold-square{width:56px}.top-brand-logo img{height:56px}.top-brand-logo .gold-square{height:7px;margin-top:5px}.top-brand-text:after{height:4px;margin-top:6px}}</style></head><body><main class="page"><div class="top-brand"><div class="top-brand-logo"><img src="assets/logo.svg" alt="شعار مناحل شيخ الجبل"><div class="gold-square"></div></div><div class="top-brand-text"><strong>مناحل شيخ الجبل</strong><span>العسل الحضرمي</span></div></div><div id="login" class="login"><h2>ملف المدير</h2><p>إدارة أختام وهدايا العملاء.</p><input class="field" id="email" type="email" placeholder="بريد المدير"><input class="field" id="pass" type="password" placeholder="كلمة المرور"><button class="btn btn-primary" id="enter" style="width:100%">دخول</button></div><section id="panel" class="hidden"><div class="wallet-head"><h1>ملف المدير</h1></div><div id="list"></div><button class="btn btn-light" id="out" style="width:100%;margin-top:10px">خروج</button></section><footer class="footer">جميع الحقوق محفوظة © 2026 مناحل شيخ الجبل للعسل الحضرمي</footer></main><div id="toast" class="toast"></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';import{getFirestore,collection,getDocs,doc,updateDoc}from'https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyBKhZMX8neMsKzjx7UWbpVzFgQ4FyP99c',authDomain:'sheikh-apiaries-stamp-card.firebaseapp.com',projectId:'sheikh-apiaries-stamp-card',storageBucket:'sheikh-apiaries-stamp-card.firebasestorage.app',messagingSenderId:'80280866205',appId:'1:80280866205:web:04d6a300e2652f773a7374',measurementId:'G-3TTMGFLSBQ'};const ADMIN_UID='DPOfZKEEhogjxeEgoKijthen7gZ2';const a=initializeApp(firebaseConfig),auth=getAuth(a),db=getFirestore(a),$=x=>document.getElementById(x);function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2000)}
$('enter').onclick=()=>signInWithEmailAndPassword(auth,$('email').value,$('pass').value).catch(()=>toast('بيانات الدخول غير صحيحة'));
onAuthStateChanged(auth,u=>{if(u&&u.uid===ADMIN_UID){$('login').classList.add('hidden');$('panel').classList.remove('hidden');load()}else if(u){signOut(auth);toast('هذا الحساب ليس حساب المدير')}else{$('login').classList.remove('hidden');$('panel').classList.add('hidden')}});
async function load(){let s=await getDocs(collection(db,'customers'));$('list').innerHTML='';s.forEach(x=>{let d=x.data(),n=Math.min(10,Math.max(0,+d.stamps||0)),e=document.createElement('div');e.className='info-card';e.style.marginBottom='10px';e.innerHTML=`<h2>${d.name||'عميل'}</h2><p>${d.phone||''}<br>الأختام: <b>${n}/10</b></p><div class="action-row"><button class="btn btn-primary add">+ ختم</button><button class="btn btn-light reset">تصفير</button></div>`;e.querySelector('.add').onclick=async()=>{if(n>=10)return toast('البطاقة مكتملة');await updateDoc(doc(db,'customers',x.id),{stamps:n+1});load()};e.querySelector('.reset').onclick=async()=>{if(confirm('هل تم تسليم الهدية؟')){await updateDoc(doc(db,'customers',x.id),{stamps:0});load()}};$('list').appendChild(e)})}$('out').onclick=()=>signOut(auth);</script></body></html>
